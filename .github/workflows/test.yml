on:
  push:
    branches:
      - *
    paths:
      - "**/*.rs"
      - "**/*.el"
      - "Cargo.*"
  pull_request:

jobs:
  check:
    matrix:
      include:
        - host: ubuntu-latest
        - host: windows-latest
        - host: macos-latest
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v6
      - uses: jcs090218/setup-emacs@v3
        with:
          version: 30.1
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        # with:
        #   components: "clippy, rustfmt"
      - name: Test
        run: |
          cargo xtask build
          cargo xtask test
