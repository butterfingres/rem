on:
  push:
    paths:
      - ".github/workflows/*.yml"
      - "**/*.rs"
      - "**/*.el"
      - "Cargo.*"
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      matrix:
        include:
          - host: ubuntu-latest
          - host: windows-latest
          - host: macos-latest
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v6
      - uses: jcs090218/setup-emacs@v3
        with:
          version: 30.1
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        # with:
        #   components: "clippy, rustfmt"
      - name: Test
        shell: bash
        run: |
          ./configure CARGOPROFILE=debug
          make check
